name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT
      
    - name: Rename APK files
      run: |
        mkdir -p release
        cp app/build/outputs/apk/debug/app-debug.apk release/JDCrawler-debug-${{ steps.date.outputs.date }}.apk
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk release/JDCrawler-release-${{ steps.date.outputs.date }}.apk
        fi
        
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: JDCrawler-debug-${{ steps.date.outputs.date }}
        path: release/JDCrawler-debug-${{ steps.date.outputs.date }}.apk
        retention-days: 30
        
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: JDCrawler-release-${{ steps.date.outputs.date }}
        path: release/JDCrawler-release-${{ steps.date.outputs.date }}.apk
        retention-days: 90
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.date.outputs.date }}
        name: 京东爬虫助手 v${{ steps.date.outputs.date }}
        body: |
          ## 📱 京东商品深度爬虫助手
          
          ### 🚀 功能特性
          - ✅ 深度爬取京东店铺商品详情
          - ✅ 智能提取商品规格参数
          - ✅ 生成专业Excel报告
          - ✅ 无需root权限
          
          ### 📦 下载说明
          - **JDCrawler-debug**: 调试版本，包含详细日志
          - **JDCrawler-release**: 发布版本，体积更小，性能更好
          
          ### 📋 使用步骤
          1. 下载并安装APK
          2. 开启无障碍服务权限
          3. 打开京东APP进入店铺页面
          4. 启动爬虫助手开始爬取
          
          ### ⚠️ 注意事项
          - 支持Android 7.0+
          - 首次使用需要手动开启权限
          - 建议在WiFi环境下使用
          
          ---
          **构建时间**: ${{ steps.date.outputs.date }}  
          **构建版本**: ${{ github.sha }}
        files: |
          release/JDCrawler-debug-${{ steps.date.outputs.date }}.apk
          release/JDCrawler-release-${{ steps.date.outputs.date }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run tests
      run: ./gradlew test --stacktrace
      
    - name: Run lint
      run: ./gradlew lint --stacktrace
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results.html
        retention-days: 7
