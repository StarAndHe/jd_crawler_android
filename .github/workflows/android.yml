name: Simple Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Download Gradle and build
      run: |
        echo "下载Gradle..."
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        
        echo "创建配置文件..."
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        echo "开始构建APK..."
        ./gradle-8.2/bin/gradle assembleDebug --no-daemon --stacktrace
        
        echo "验证APK文件..."
        ls -la app/build/outputs/apk/debug/ || echo "目录不存在"
        find . -name "*.apk" -type f || echo "未找到APK文件"
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JDCrawler-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
